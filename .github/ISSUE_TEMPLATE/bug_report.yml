name: Bug Report
description: Report incorrect behavior or a crash
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Build graph with N nodes, K neighbors
        2. Call spectral_init(graph, 2, config)
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: rust_version
    attributes:
      label: Rust Version
      placeholder: "rustc 1.85.0 (e71f9a9a9 2025-01-27)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 24.04 / macOS 15.3 / Windows 11"
    validations:
      required: true

  - type: input
    id: cpu_features
    attributes:
      label: CPU Features
      description: Output of `RUSTFLAGS="-C target-cpu=native" cargo rustc -- --print cfg 2>&1 | grep target_feature`
      placeholder: 'target_feature = "avx2"'

  - type: input
    id: graph_size
    attributes:
      label: Graph Size
      description: Approximate number of nodes (N) and non-zeros (nnz) in the adjacency matrix
      placeholder: "N=5000, nnz=50000"

  - type: dropdown
    id: compute_mode
    attributes:
      label: ComputeMode
      options:
        - PythonCompat
        - RustNative
        - (not applicable)
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Error Output
      description: Full panic message, backtrace, or solver error
      render: text
