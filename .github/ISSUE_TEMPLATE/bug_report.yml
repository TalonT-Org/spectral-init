name: Bug Report
description: Report incorrect behavior or a crash
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Build graph with N nodes, K neighbors
        2. Call spectral_init(graph, 2, config)
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: rust_version
    attributes:
      label: Rust Version
      placeholder: "rustc 1.88.0 (6b00bc388 2025-06-23)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 24.04 / macOS 15.3 / Windows 11"
    validations:
      required: true

  - type: input
    id: cpu_features
    attributes:
      label: CPU Features
      description: CPU model and, on x86_64, whether it supports AVX2 and FMA (Linux — `lscpu | grep -o -w -E 'avx2|fma' | sort -u`)
      placeholder: "AMD Ryzen 9 7950X — avx2, fma"

  - type: input
    id: graph_size
    attributes:
      label: Graph Size
      description: Approximate number of nodes (N) and non-zeros (nnz) in the adjacency matrix
      placeholder: "N=5000, nnz=50000"

  - type: dropdown
    id: compute_mode
    attributes:
      label: ComputeMode
      options:
        - PythonCompat
        - RustNative
        - (not applicable)
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Error Output
      description: Full panic message, backtrace, or solver error
      render: text
