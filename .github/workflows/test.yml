name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  merge_group:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: cargo nextest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (CI profile)
        run: cargo nextest run --locked --profile ci --features testing

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: target/nextest/ci/junit.xml
          retention-days: 30

      - name: Report test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          fail_on_failure: false
          annotate_only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build rustdoc
        run: cargo doc --locked --no-deps -p spectral-init
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Run doctests
        run: cargo test --locked --doc

  msrv:
    name: msrv
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check the library on the MSRV toolchain
        run: cargo check --locked --lib -p spectral-init

  package:
    name: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Package gate
        run: .github/scripts/check-package.sh
