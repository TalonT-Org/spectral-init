name: Dependencies

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  schedule:
    # Mondays at 04:00 UTC: advisories appear without any change to the repository.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Advisories, licenses, bans and sources
        run: cargo deny --workspace --config .config/deny.toml check

      # The zip advisory ignores in .config/deny.toml hold only while zip stays out of
      # the published crate's dependency tree.
      - name: The published crate does not depend on zip
        run: |
          tree="$(cargo tree --locked -p spectral-init --edges normal,build --prefix none --all-features)"
          if grep -q '^zip ' <<< "$tree"; then
            echo "::error::zip is in the published crate's dependency tree; the zip advisory ignores in .config/deny.toml assume it is not"
            exit 1
          fi

  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2

      - name: Unused dependencies
        run: cargo machete
