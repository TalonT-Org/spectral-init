name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-rs:
    name: docs.rs build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs.rs builds with a nightly toolchain and the settings under
      # [package.metadata.docs.rs]; cargo-docs-rs reproduces that build.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-08-10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-docs-rs
        run: cargo install --locked cargo-docs-rs --version 1.0.4

      - name: Build the documentation as docs.rs does
        run: cargo docs-rs -p spectral-init

  sri:
    name: KaTeX integrity hashes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the hashes in docs/katex-header.html with the files
        run: .github/scripts/check-sri.sh
