name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  merge_group:
  schedule:
    # Mondays at 03:00 UTC; the scheduled run also runs the slow tests.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            os: ubuntu-latest
          - label: ubuntu-24.04-arm
            os: ubuntu-24.04-arm
          - label: macos-15
            os: macos-15
          - label: windows-latest
            os: windows-latest
          # The default x86_64 build detects AVX2 at run time; this leg compiles it in.
          - label: ubuntu-latest-x86-64-v3
            os: ubuntu-latest
            rustflags: -C target-cpu=x86-64-v3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Set RUSTFLAGS
        if: matrix.rustflags != ''
        shell: bash
        run: echo "RUSTFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.label }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Run tests (CI profile)
        run: cargo nextest run --locked --workspace --all-features --profile ci

      - name: Upload JUnit XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-results-${{ matrix.label }}
          path: target/nextest/ci/junit.xml
          retention-days: 30

      - name: Report test results
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: always()
        with:
          check_name: JUnit (${{ matrix.label }})
          report_paths: target/nextest/ci/junit.xml
          fail_on_failure: false
          annotate_only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

  slow:
    name: slow tests
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Run slow tests
        run: cargo nextest run --locked --workspace --all-features --profile slow

  # The required check: one result for the whole test matrix.
  nextest:
    name: cargo nextest
    runs-on: ubuntu-latest
    needs: [test, slow]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Every test job passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SLOW_RESULT: ${{ needs.slow.result }}
        run: |
          echo "test matrix: ${TEST_RESULT}; slow tests: ${SLOW_RESULT}"
          if [ "$TEST_RESULT" != "success" ]; then
            exit 1
          fi
          # The slow tests run on the schedule only; a skipped job counts as passed.
          if [ "$SLOW_RESULT" != "success" ] && [ "$SLOW_RESULT" != "skipped" ]; then
            exit 1
          fi

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (the build users compile)
        run: cargo clippy --locked -p spectral-init --all-targets -- -D warnings

      - name: Clippy (workspace, all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Purity gate
        run: .github/scripts/check-purity.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build rustdoc
        run: cargo doc --locked --no-deps -p spectral-init
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Run doctests
        run: cargo test --locked --workspace --doc

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the library on the MSRV toolchain
        run: cargo check --locked --lib -p spectral-init

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Package gate
        run: .github/scripts/check-package.sh

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-08-10
          components: miri, rust-src

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run the AVX2 kernel tests under Miri
        run: cargo miri test --locked -p spectral-init --lib operator
        env:
          RUSTFLAGS: "-C target-feature=+avx2,+fma"
