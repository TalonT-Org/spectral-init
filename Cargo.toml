[package]
name = "spectral-init"
version = "0.1.0"
edition = "2024"
description = "Spectral initialization for UMAP embeddings"
license = "MIT"
repository = "https://github.com/TalonT-Org/spectral-init"
readme = "README.md"
documentation = "https://docs.rs/spectral-init"
rust-version = "1.85"
keywords = ["umap", "dimensionality-reduction", "spectral", "eigenvectors", "embeddings"]
categories = ["science", "mathematics", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/katex-header.html"]

[features]
# Expose internal solver functions for integration tests.
# Not part of the stable public API.
testing = ["dep:serde"]
profiling = []
# Enable CLI binary (trustworthiness) and .npy I/O support.
cli = ["dep:ndarray-npy", "dep:pico-args", "dep:serde_json", "dep:libc"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
ndarray-npy = { version = "0.10", optional = true }
pico-args = { version = "0.5", optional = true }
sprs = "0.11"
ndarray = "0.17"
faer = "0.24"
rand = "0.9"
rand_distr = "0.5"
rayon = "1"
thiserror = "2"
linfa-linalg = "0.2"        # pure-Rust LOBPCG; no LAPACK backend required
log = "0.4"                 # logging facade for library diagnostics
ndarray16 = { package = "ndarray", version = "0.16" }  # linfa-linalg uses ndarray 0.16; alias for bridging
serde_json = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
ndarray-npy = "0.10"
approx = "0.5"
serde_json = "1"
humantime = "2"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.test.package.spectral-init]
opt-level = 2
debug-assertions = true
overflow-checks = true

