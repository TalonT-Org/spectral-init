[package]
name = "spectral-init"
version = "0.1.0"
edition = "2024"
description = "Spectral initialization for UMAP embeddings"
license = "MIT"
repository = "https://github.com/TalonT-Org/spectral-init"
readme = "README.md"
rust-version = "1.88"
keywords = ["umap", "spectral", "laplacian", "eigenvectors", "embedding"]
categories = ["science", "mathematics", "algorithms"]
include = [
    "/src/**",
    "/examples/**",
    "/docs/katex-header.html",
    "/docs/umap-rs-integration.md",
    "/README.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/katex-header.html"]

[workspace]
members = ["trustworthiness", "eval"]

[features]
# Exposes `spectral_init::__internal` to this crate's own integration tests and to
# the `eval` research harness. Exempt from semver; not for downstream use.
__internal = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dependencies]
sprs = { version = "0.11", default-features = false }
ndarray = "0.17"
# `rayon` keeps faer's parallel dense solvers; `sparse-linalg` provides the sparse Cholesky.
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
rand = "0.9"
rand_chacha = "0.9"       # the named generator behind the reproducibility contract
rand_distr = "0.5"
thiserror = "2"
linfa-linalg = "0.2"        # pure-Rust LOBPCG; no LAPACK backend required
log = "0.4"                 # logging facade for library diagnostics
ndarray16 = { package = "ndarray", version = "0.16" }  # linfa-linalg uses ndarray 0.16; alias for bridging

[dev-dependencies]
ndarray-npy = "0.10"
approx = "0.5"
serde_json = "1"
humantime = "2"
proptest = "1"
umap-rs = "0.4.5"           # the integration the `umap_rs` example and test compile against

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.trustworthiness]
opt-level = 2

[profile.dev.package.spectral-init-eval]
opt-level = 2

[profile.test.package.spectral-init]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.trustworthiness]
opt-level = 2

[profile.test.package.spectral-init-eval]
opt-level = 2

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "compute_modes"
path = "examples/compute_modes.rs"

[[example]]
name = "from_adjacency_list"
path = "examples/from_adjacency_list.rs"

[[example]]
name = "umap_rs"
path = "examples/umap_rs.rs"
