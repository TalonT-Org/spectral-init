[package]
name = "spectral-init"
version = "0.1.0"
edition = "2024"
description = "Spectral initialization for UMAP embeddings"
license = "MIT"
repository = "https://github.com/TalonT-Org/spectral-init"
readme = "README.md"
rust-version = "1.88"
keywords = ["umap", "spectral", "laplacian", "eigenvectors", "embedding"]
categories = ["science", "mathematics", "algorithms"]
include = ["/src/**", "/examples/**", "/docs/katex-header.html", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/katex-header.html"]

[workspace]
members = ["trustworthiness", "eval"]

[features]
# Exposes `spectral_init::__internal` to this crate's own integration tests and to
# the `eval` research harness. Exempt from semver; not for downstream use.
__internal = []

[dependencies]
sprs = "0.11"
ndarray = "0.17"
faer = "0.24"
rand = "0.9"
rand_distr = "0.5"
thiserror = "2"
linfa-linalg = "0.2"        # pure-Rust LOBPCG; no LAPACK backend required
log = "0.4"                 # logging facade for library diagnostics
ndarray16 = { package = "ndarray", version = "0.16" }  # linfa-linalg uses ndarray 0.16; alias for bridging

[dev-dependencies]
ndarray-npy = "0.10"
approx = "0.5"
serde_json = "1"
humantime = "2"
proptest = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.trustworthiness]
opt-level = 2

[profile.dev.package.spectral-init-eval]
opt-level = 2

[profile.test.package.spectral-init]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.trustworthiness]
opt-level = 2

[profile.test.package.spectral-init-eval]
opt-level = 2

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "compute_modes"
path = "examples/compute_modes.rs"

[[example]]
name = "from_adjacency_list"
path = "examples/from_adjacency_list.rs"
