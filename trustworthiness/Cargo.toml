[package]
name = "trustworthiness"
version = "0.1.0"
edition = "2024"
description = "Trustworthiness metric for low-dimensional embeddings, with a command-line tool"
license = "MIT"
repository = "https://github.com/TalonT-Org/spectral-init"
rust-version = "1.88"
publish = false

[features]
# Per-step timing lines on stderr. `tw_profiler --stderr-capture` reports them as
# `step_timing` only when built with both `cli` and `profiling`.
profiling = []
# Command-line binaries and `.npy` input.
cli = ["dep:ndarray-npy", "dep:pico-args", "dep:serde_json", "dep:libc"]
# Exposes the AVX2 distance kernel to `benches/dist_sq_bench.rs`. Exempt from semver;
# not for downstream use.
__bench = []

[dependencies]
ndarray = "0.17"
rayon = "1"
rand = "0.9"
ndarray-npy = { version = "0.10", optional = true }
pico-args = { version = "0.5", optional = true }
serde_json = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
ndarray-npy = "0.10"
serde_json = "1"

[[bin]]
name = "trustworthiness"
path = "src/bin/trustworthiness.rs"
required-features = ["cli"]

[[bin]]
name = "tw_profiler"
path = "src/bin/tw_profiler.rs"
required-features = ["cli"]

[[bench]]
name = "trustworthiness_bench"
harness = false

[[bench]]
name = "dist_sq_bench"
harness = false
required-features = ["__bench"]

[[test]]
name = "test_tw_profiler"
path = "tests/test_tw_profiler.rs"
required-features = ["cli"]
